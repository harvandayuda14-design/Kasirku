<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>KasirKu</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#fbf3df;--panel:#fffaf0;--ink:#3b1b0b;--muted:#826b58;--accent:#8b4513;--dark:#4a210b;--line:#ead9bc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--dark);color:#fff;padding:20px 18px 17px;position:sticky;top:0;z-index:3}
.top{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:22px;letter-spacing:.2px}.brand span{color:#d9a72e}
.date{color:#b8c3d2;font-size:12px;margin-top:5px}.main{padding:14px;max-width:1000px;margin:auto}
.tabs{display:flex;gap:8px;overflow:auto;margin:0 0 14px}.tab{border:0;border-radius:20px;padding:10px 15px;background:#e6eaf0;color:#344054;font-weight:650;white-space:nowrap}.tab.active{background:var(--dark);color:white}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:white;margin-bottom:12px;font-size:15px}
.categories{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.cat{border:1px solid var(--line);background:white;border-radius:18px;padding:8px 12px;white-space:nowrap}.cat.active{background:#f1dfb8;border-color:#d9b36c;color:#5b2c0b}
.layout{display:grid;grid-template-columns:1fr;gap:14px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.product{background:var(--panel);border-radius:15px;padding:13px;border:1px solid var(--line);cursor:pointer;min-height:106px}.emoji{font-size:25px}.pname{font-weight:700;margin-top:5px}.price{color:var(--accent);font-weight:750;margin-top:4px}
.panel{background:white;border-radius:16px;padding:15px;border:1px solid var(--line)}.panel h3{margin:0 0 10px}.cartrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.controls{display:flex;align-items:center;gap:7px}.small{border:0;border-radius:8px;background:#edf1f5;padding:5px 9px;font-weight:700}.total{font-size:21px;font-weight:800;display:flex;justify-content:space-between;padding:14px 0}.primary{width:100%;border:0;background:var(--accent);color:white;font-weight:800;padding:13px;border-radius:12px;font-size:16px}.secondary{border:0;background:#e9edf2;padding:11px;border-radius:10px;font-weight:700}.row{display:flex;gap:8px;align-items:center}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:14px;border-radius:14px;background:white;border:1px solid var(--line)}.stat b{display:block;font-size:20px;margin-top:5px}.muted{color:var(--muted);font-size:13px}.formgrid{display:grid;gap:10px}.formgrid input,.formgrid select{padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.tx{border-bottom:1px solid var(--line);padding:11px 0}.tx strong{display:block}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#152033;color:white;padding:10px 15px;border-radius:20px;z-index:10;display:none}
@media(min-width:750px){.layout{grid-template-columns:1.45fr .85fr}.products{grid-template-columns:repeat(3,minmax(0,1fr))}.main{padding:22px}.stats{grid-template-columns:repeat(4,1fr)}}
.logoBox{width:44px;height:44px;border-radius:12px;background:#263448;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-right:10px;font-size:22px}.logoBox img{width:100%;height:100%;object-fit:contain;background:#fff}.brandRow{display:flex;align-items:center}.thumb{width:44px;height:44px;object-fit:cover;border-radius:10px;margin-bottom:5px}.settingsCard{background:white;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px}
</style>
</head>
<body>
<header><div class="top"><div class="brandRow"><div class="logoBox" id="logoBox">🧾</div><div><div class="brand" id="brandName">Rumah Kopi</div><div class="date" id="today"></div></div></div><button class="secondary" onclick="showTab('products')">＋ Produk</button></div></header>
<main class="main">
<div class="tabs">
<button class="tab active" data-tab="cashier" onclick="showTab('cashier')">Kasir</button>
<button class="tab" data-tab="products" onclick="showTab('products')">Produk</button>
<button class="tab" data-tab="history" onclick="showTab('history')">Riwayat</button>
<button class="tab" data-tab="reports" onclick="showTab('reports')">Laporan</button><button class="tab" data-tab="settings" onclick="showTab('settings')">Pengaturan</button>
</div>
<section id="cashier">
<input id="search" class="search" placeholder="Cari produk..." oninput="renderProducts()">
<div class="categories" id="categories"></div>
<div class="layout"><div id="productGrid" class="products"></div>
<div class="panel"><h3>Keranjang</h3><div id="cart"></div><div class="total"><span>Total</span><span id="cartTotal">Rp0</span></div>
<label class="muted">Pembayaran</label><input id="paid" class="search" inputmode="numeric" placeholder="Masukkan jumlah uang" oninput="renderCart()">
<div class="row" style="justify-content:space-between;margin:5px 0 13px"><span class="muted">Kembalian</span><strong id="change">Rp0</strong></div>
<button class="primary" onclick="checkout()">Selesaikan Transaksi</button></div></div>
</section>
<section id="products" class="hidden"><div class="panel"><h3>Kelola Menu</h3><p class="muted">Tambah dan ubah menu di tab Pengaturan.</p><button class="primary" onclick="showTab('settings')">Buka pengaturan menu</button></div></section>
<section id="history" class="hidden"><div class="panel"><h3>Riwayat Transaksi</h3><div id="historyList"></div></div></section>
<section id="reports" class="hidden"><h3>Ringkasan Penjualan</h3><div class="stats" id="stats"></div><div class="panel" style="margin-top:12px"><h3>Penjualan Hari Ini</h3><div id="todayReport"></div></div><button class="secondary" style="margin-top:12px" onclick="exportData()">Ekspor data JSON</button><button class="secondary" style="margin:8px 0 0" onclick="resetData()">Reset data demo</button></section>
<section id="settings" class="hidden">
<div class="settingsCard"><h3>Identitas Usaha</h3><div class="formgrid"><label>Nama usaha<input id="businessName" placeholder="Nama usaha"></label><label>Logo (pilih dari galeri)<input id="logoInput" type="file" accept="image/*"></label><div id="logoPreview" class="muted">Logo belum dipilih</div><button class="primary" onclick="saveSettings()">Simpan identitas</button></div></div>
<div class="settingsCard"><h3>Tambah / Edit Menu</h3><form id="productForm" class="formgrid"><input id="editIndex" type="hidden"><input id="newName" placeholder="Nama menu" required><input id="newPrice" placeholder="Harga (angka)" inputmode="numeric" required><select id="newCat"><option>Minuman</option><option>Makanan</option><option>Snack</option><option>Lainnya</option></select><input id="newEmoji" placeholder="Emoji (opsional, contoh ☕)"><label>Foto menu (opsional)<input id="productImage" type="file" accept="image/*"></label><button class="primary" id="productSaveBtn">Tambah menu</button><button class="secondary hidden" type="button" id="cancelEdit" onclick="cancelEdit()">Batal edit</button></form></div>
<div class="settingsCard"><h3>Daftar Menu</h3><div id="productManage"></div></div></section>
</main><div id="toast" class="toast"></div>
<script>
const starter=[{name:"Kopi Hitam",price:12000,cat:"Minuman",emoji:"☕"},{name:"Kopi Susu",price:15000,cat:"Minuman",emoji:"🥤"},{name:"Sanger",price:15000,cat:"Minuman",emoji:"☕"},{name:"Kopi Gula Aren",price:20000,cat:"Minuman",emoji:"🧋"},{name:"Butterscotch",price:20000,cat:"Minuman",emoji:"🥤"},{name:"Teh",price:8000,cat:"Minuman",emoji:"🍵"},{name:"Roti Bakar",price:15000,cat:"Makanan",emoji:"🍞"},{name:"Kentang Goreng",price:18000,cat:"Makanan",emoji:"🍟"}];
let products=JSON.parse(localStorage.getItem("kk_products")||"null")||starter;
let transactions=JSON.parse(localStorage.getItem("kk_transactions")||"[]"),cart={},category="Semua";
const money=n=>"Rp"+Number(n||0).toLocaleString("id-ID");
const save=()=>{localStorage.setItem("kk_products",JSON.stringify(products));localStorage.setItem("kk_transactions",JSON.stringify(transactions))};
document.getElementById("today").textContent=new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function showTab(t){document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));document.getElementById(t).classList.remove("hidden");document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));if(t==="history")renderHistory();if(t==="reports")renderReports();if(t==="products")renderManage();if(t==="settings"){renderManage();applySettings()}}
function renderCategories(){let cats=["Semua",...new Set(products.map(p=>p.cat))];document.getElementById("categories").innerHTML=cats.map(c=>`<button class="cat ${c===category?"active":""}" onclick="category='${c}';renderCategories();renderProducts()">${c}</button>`).join("")}
function renderProducts(){renderCategories();let q=document.getElementById("search").value.toLowerCase();let filtered=products.filter(p=>(category==="Semua"||p.cat===category)&&p.name.toLowerCase().includes(q));document.getElementById("productGrid").innerHTML=filtered.map((p,i)=>`<div class="product" onclick="addCart(${products.indexOf(p)})">${p.image?`<img class="thumb" src="${p.image}">`:`<div class="emoji">${p.emoji||"🛍️"}</div>`}<div class="pname">${p.name}</div><div class="price">${money(p.price)}</div></div>`).join("")||'<div class="muted">Produk tidak ditemukan.</div>'}
function addCart(i){cart[i]=(cart[i]||0)+1;renderCart()}
function renderCart(){let el=document.getElementById("cart"),keys=Object.keys(cart);el.innerHTML=keys.map(k=>{let p=products[k];return p?`<div class="cartrow"><div><strong>${p.name}</strong><div class="muted">${money(p.price)} × ${cart[k]}</div></div><div class="controls"><button class="small" onclick="qty(${k},-1)">−</button><b>${cart[k]}</b><button class="small" onclick="qty(${k},1)">＋</button></div></div>`:""}).join("")||'<div class="muted">Belum ada produk.</div>';let total=keys.reduce((s,k)=>s+(products[k]?.price||0)*cart[k],0);document.getElementById("cartTotal").textContent=money(total);let paid=Number(document.getElementById("paid").value||0);document.getElementById("change").textContent=money(Math.max(0,paid-total))}
function qty(i,d){cart[i]+=d;if(cart[i]<=0)delete cart[i];renderCart()}
function checkout(){let keys=Object.keys(cart),total=keys.reduce((s,k)=>s+(products[k]?.price||0)*cart[k],0),paid=Number(document.getElementById("paid").value||0);if(!keys.length)return toast("Keranjang masih kosong");if(paid<total)return toast("Uang pembayaran belum cukup");let items=keys.map(k=>({name:products[k].name,price:products[k].price,qty:cart[k]}));transactions.unshift({id:Date.now(),date:new Date().toISOString(),items,total,paid,change:paid-total});cart={};document.getElementById("paid").value="";save();renderCart();toast("Transaksi berhasil disimpan")}
let logoData=localStorage.getItem("kk_logo")||"logo.png",businessName=localStorage.getItem("kk_business")||"Rumah Kopi";
function applySettings(){document.getElementById("brandName").textContent=businessName;document.getElementById("businessName").value=businessName;document.getElementById("logoBox").innerHTML=logoData?`<img src="${logoData}">`:"☕";document.getElementById("logoPreview").innerHTML=logoData?`<img src="${logoData}" style="max-width:110px;max-height:110px;object-fit:contain;border-radius:12px">`:"Logo belum dipilih"}
document.getElementById("logoInput").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{logoData=r.result;applySettings()};r.readAsDataURL(f)});
function saveSettings(){businessName=document.getElementById("businessName").value.trim()||"KasirKu";localStorage.setItem("kk_business",businessName);if(logoData)localStorage.setItem("kk_logo",logoData);applySettings();toast("Identitas Rumah Kopi disimpan")}
document.getElementById("productForm").addEventListener("submit",e=>{e.preventDefault();const name=document.getElementById("newName").value.trim(),price=Number(document.getElementById("newPrice").value),cat=document.getElementById("newCat").value,emoji=document.getElementById("newEmoji").value.trim()||"🛍️",idx=document.getElementById("editIndex").value,file=document.getElementById("productImage").files[0];const saveItem=image=>{if(!name||price<=0)return;const item={name,price,cat,emoji,image:image||null};if(idx!=="")products[Number(idx)]=item;else products.push(item);save();e.target.reset();document.getElementById("editIndex").value="";document.getElementById("productSaveBtn").textContent="Tambah menu";document.getElementById("cancelEdit").classList.add("hidden");renderProducts();renderManage();renderCart();toast(idx!==""?"Menu diperbarui":"Menu ditambahkan")};if(file){const r=new FileReader();r.onload=()=>saveItem(r.result);r.readAsDataURL(file)}else saveItem(idx!==""?products[Number(idx)].image:null)});
function editProduct(i){const p=products[i];document.getElementById("editIndex").value=i;document.getElementById("newName").value=p.name;document.getElementById("newPrice").value=p.price;document.getElementById("newCat").value=p.cat;document.getElementById("newEmoji").value=p.emoji||"";document.getElementById("productSaveBtn").textContent="Simpan perubahan";document.getElementById("cancelEdit").classList.remove("hidden");showTab("settings")}
function cancelEdit(){document.getElementById("productForm").reset();document.getElementById("editIndex").value="";document.getElementById("productSaveBtn").textContent="Tambah menu";document.getElementById("cancelEdit").classList.add("hidden")}
function renderManage(){document.getElementById("productManage").innerHTML=products.map((p,i)=>`<div class="cartrow"><div>${p.image?`<img src="${p.image}" style="width:42px;height:42px;object-fit:cover;border-radius:9px;vertical-align:middle">`:(p.emoji||"🛍️")} <strong>${p.name}</strong><div class="muted">${p.cat} · ${money(p.price)}</div></div><div class="row"><button class="small" onclick="editProduct(${i})">Edit</button><button class="small" onclick="delProduct(${i})">Hapus</button></div></div>`).join("")}
function delProduct(i){if(confirm("Hapus produk ini?")){products.splice(i,1);cart={};save();renderProducts();renderManage();renderCart()}}
function renderHistory(){document.getElementById("historyList").innerHTML=transactions.map(t=>`<div class="tx"><strong>${new Date(t.date).toLocaleString("id-ID")} · ${money(t.total)}</strong><div class="muted">${t.items.map(x=>`${x.name} ×${x.qty}`).join(", ")}</div><div class="muted">Dibayar ${money(t.paid)} · Kembali ${money(t.change)}</div></div>`).join("")||'<div class="muted">Belum ada transaksi.</div>'}
function renderReports(){let today=new Date().toDateString(),ts=transactions.filter(t=>new Date(t.date).toDateString()===today),sum=ts.reduce((a,t)=>a+t.total,0),all=transactions.reduce((a,t)=>a+t.total,0);document.getElementById("stats").innerHTML=`<div class="stat">Omzet hari ini<b>${money(sum)}</b></div><div class="stat">Transaksi hari ini<b>${ts.length}</b></div><div class="stat">Total omzet<b>${money(all)}</b></div><div class="stat">Total transaksi<b>${transactions.length}</b></div>`;let tally={};ts.forEach(t=>t.items.forEach(i=>tally[i.name]=(tally[i.name]||0)+i.qty));document.getElementById("todayReport").innerHTML=Object.entries(tally).sort((a,b)=>b[1]-a[1]).map(([n,q])=>`<div class="cartrow"><span>${n}</span><strong>${q} terjual</strong></div>`).join("")||'<div class="muted">Belum ada penjualan hari ini.</div>'}
function exportData(){let blob=new Blob([JSON.stringify({products,transactions},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="kasirku-data.json";a.click();URL.revokeObjectURL(a.href)}
function resetData(){if(confirm("Hapus riwayat dan kembalikan produk demo?")){products=starter;transactions=[];cart={};save();renderProducts();renderCart();renderReports();toast("Data demo direset")}}
function toast(m){let t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2100)}
renderProducts();renderCart();renderManage();applySettings();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
