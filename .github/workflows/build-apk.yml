
name: Build KasirKu APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract project
        run: unzip -q KasirKu_Android_Ready.zip -d project

      - name: Install dependencies
        run: cd project/KasirKu_Android && npm install

      - name: Add Android platform
        run: cd project/KasirKu_Android && npx cap add android

      - name: Sync app
        run: cd project/KasirKu_Android && npx cap sync android

      - name: Build APK
        run: cd project/KasirKu_Android/android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirKu-APK
          path: project/KasirKu_Android/android/app/build/outputs/apk/debug/app-debug.apk
